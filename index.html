<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- أوامر إجبارية لمنع المتصفح من الاحتفاظ بالنسخة القديمة المعطلة -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>تطبيق القارئ - قرآن وأذكار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f7f7f2; color: #1a1a1a; user-select: none; }
        netlify-badge, #netlify-badge, .netlify-badge, a[href*="netlify.com"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

        .mushaf-paper { background-color: #fffef6; border: 1px solid #e2dfd2; box-shadow: 0 4px 20px rgba(0,0,0,0.06); max-width: 650px; margin: 0 auto; padding: 24px 20px; min-height: 75vh; position: relative; }
        .page-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Amiri', serif; font-size: 17px; font-weight: bold; border-bottom: 2px solid #2d3748; padding-bottom: 6px; margin-bottom: 18px; color: #2d3748; }
        .quran-text { font-family: 'Amiri Quran', serif; font-size: 25px; line-height: 2.35; text-align: justify; text-justify: inter-word; }
        .surah-frame { text-align: center; font-family: 'Amiri', serif; font-size: 22px; font-weight: bold; background: repeating-linear-gradient(45deg, #eee8d5, #eee8d5 10px, #fbf7ea 10px, #fbf7ea 20px); border: 2px solid #4a5568; padding: 8px; margin: 16px 0; border-radius: 4px; }
        .bismillah-box { text-align: center; font-size: 26px; margin-bottom: 12px; font-family: 'Amiri Quran', serif; display: block; color: #0f4c3a; }
        
        .ayah-span { cursor: pointer; border-radius: 5px; padding: 2px 3px; transition: all 0.3s ease; }
        .ayah-span:hover { background-color: #fef9c3; }
        .ayah-playing { background-color: #bbf7d0 !important; color: #064e3b; font-weight: bold; border-bottom: 2px solid #059669; }
        .ayah-number { color: #8b0000; font-size: 19px; margin: 0 4px; display: inline-block; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f4c3a; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-drawer { transition: transform 0.3s ease-out; transform: translateY(100%); }
        .modal-drawer.active { transform: translateY(0); }
        .dhikr-card { transition: all 0.2s ease; cursor: pointer; }
        .dhikr-card.completed { background-color: #d1fae5; border-color: #10b981; opacity: 0.8; }
    </style>
</head>
<body class="pb-36">

    <!-- الشاشة الرئيسية -->
    <div id="homeScreen" class="container mx-auto px-4 py-12 max-w-lg min-h-screen flex flex-col justify-center transition-all">
        <div class="text-center mb-10">
            <i class="fas fa-mosque text-6xl text-[#0f4c3a] mb-4"></i>
            <h1 class="text-4xl font-bold font-['Amiri'] text-[#0f4c3a]">زاد المسلم</h1>
            <p class="text-gray-600 mt-2 font-semibold">القرآن الكريم والأذكار اليومية</p>
        </div>
        <div class="grid grid-cols-1 gap-4">
            <button onclick="navTo('indexScreen')" class="bg-[#0f4c3a] hover:bg-[#0b382a] text-white p-6 rounded-2xl shadow-lg flex items-center justify-between transition group">
                <div class="flex items-center gap-4">
                    <div class="bg-white/20 p-4 rounded-full"><i class="fas fa-book-open text-3xl"></i></div>
                    <div class="text-right"><h2 class="text-2xl font-bold font-['Amiri']">القرآن الكريم</h2><p class="text-sm text-gray-200">تلاوة، تحفيظ، وتفسير</p></div>
                </div>
                <i class="fas fa-chevron-left text-xl group-hover:-translate-x-2 transition"></i>
            </button>
            <button onclick="navTo('adhkarCategoryScreen')" class="bg-white border-2 border-[#0f4c3a] text-[#0f4c3a] hover:bg-gray-50 p-6 rounded-2xl shadow-lg flex items-center justify-between transition group">
                <div class="flex items-center gap-4">
                    <div class="bg-[#0f4c3a]/10 p-4 rounded-full"><i class="fas fa-hands-praying text-3xl"></i></div>
                    <div class="text-right"><h2 class="text-2xl font-bold font-['Amiri']">الأذكار</h2><p class="text-sm text-gray-500">صباح، مساء، ونوم</p></div>
                </div>
                <i class="fas fa-chevron-left text-xl group-hover:-translate-x-2 transition"></i>
            </button>
        </div>
    </div>

    <!-- أقسام الأذكار -->
    <div id="adhkarCategoryScreen" class="hidden container mx-auto px-4 py-8 max-w-lg transition-all">
        <button onclick="navTo('homeScreen')" class="mb-6 text-gray-600 hover:text-gray-900 font-bold flex items-center gap-2"><i class="fas fa-arrow-right"></i> الرئيسية</button>
        <h2 class="text-3xl font-bold font-['Amiri'] text-center text-[#0f4c3a] mb-8">حصن المسلم</h2>
        <div class="grid grid-cols-1 gap-4">
            <button onclick="openAdhkarList('morning')" class="bg-gradient-to-r from-blue-50 to-blue-100 border border-blue-200 p-5 rounded-xl shadow flex items-center justify-between text-blue-900"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-sun text-yellow-500 ml-2"></i> أذكار الصباح</span><i class="fas fa-chevron-left"></i></button>
            <button onclick="openAdhkarList('evening')" class="bg-gradient-to-r from-orange-50 to-orange-100 border border-orange-200 p-5 rounded-xl shadow flex items-center justify-between text-orange-900"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-moon text-indigo-500 ml-2"></i> أذكار المساء</span><i class="fas fa-chevron-left"></i></button>
            <button onclick="openAdhkarList('sleep')" class="bg-gradient-to-r from-indigo-50 to-indigo-100 border border-indigo-200 p-5 rounded-xl shadow flex items-center justify-between text-indigo-900"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-bed text-purple-500 ml-2"></i> أذكار النوم</span><i class="fas fa-chevron-left"></i></button>
        </div>
    </div>

    <!-- قراءة الأذكار -->
    <div id="adhkarListScreen" class="hidden container mx-auto px-4 py-8 max-w-xl pb-24 transition-all">
        <button onclick="navTo('adhkarCategoryScreen')" class="mb-4 text-gray-600 hover:text-gray-900 font-bold flex items-center gap-2"><i class="fas fa-arrow-right"></i> رجوع للأقسام</button>
        <h2 id="adhkarTitle" class="text-2xl font-bold font-['Amiri'] text-center text-[#0f4c3a] mb-2">الأذكار</h2>
        <p class="text-center text-xs text-gray-500 mb-6 border-b pb-4">انقر على الذكر عند قراءته ليتم حسابه</p>
        <div id="adhkarContainer" class="flex flex-col gap-4"></div>
    </div>

    <!-- فهرس القرآن -->
    <div id="indexScreen" class="hidden container mx-auto px-4 py-8 max-w-3xl transition-all">
        <button onclick="navTo('homeScreen')" class="mb-4 text-white hover:text-gray-200 font-bold bg-[#0f4c3a] px-4 py-2 rounded-lg shadow inline-flex items-center gap-2"><i class="fas fa-home"></i> الرئيسية</button>
        <div class="text-center mb-6 bg-[#0f4c3a] text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
            <h1 class="text-3xl font-bold font-['Amiri'] mb-1">القرآن الكريم</h1>
            <p class="text-xs text-gray-200 mb-4">استمع، اقرأ، وتدبر كلام الله</p>
            <div id="khatmahCard" class="bg-white/10 p-4 rounded-xl border border-white/20 flex justify-between items-center gap-3">
                <div class="text-right">
                    <span class="text-xs text-yellow-300 font-bold block">متابعة الختمة</span>
                    <span id="khatmahLabel" class="text-sm font-semibold">الصفحة 1</span>
                </div>
                <button onclick="resumeBookmark()" class="bg-[#d4af37] text-gray-900 px-4 py-2 rounded-lg font-bold text-xs shadow-md hover:bg-yellow-500 transition">واصل القراءة</button>
            </div>
        </div>
        <input type="text" id="searchInput" onkeyup="searchSurah()" placeholder="ابحث باسم السورة..." class="w-full px-5 py-3 rounded-xl border-2 border-gray-300 focus:border-[#0f4c3a] outline-none mb-5 text-base shadow-sm">
        <div id="listLoader" class="loader"></div>
        <div id="surahsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 hidden"></div>
    </div>

    <!-- المصحف (القراءة) -->
    <div id="mushafScreen" class="hidden pt-3 px-2 transition-all">
        <div class="max-w-[650px] mx-auto flex justify-between items-center mb-3">
            <button onclick="navTo('indexScreen'); stopAudio();" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-gray-900 transition"><i class="fas fa-list ml-1"></i> الفهرس</button>
            <button onclick="saveCurrentBookmark()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center gap-1"><i class="fas fa-bookmark"></i> حفظ الفاصل</button>
            <div class="flex gap-1.5">
                <button onclick="changePage(1)" class="bg-[#0f4c3a] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-[#0c3b2d]">السابق</button>
                <button onclick="changePage(-1)" class="bg-[#0f4c3a] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-[#0c3b2d]">التالي</button>
            </div>
        </div>
        <div class="mushaf-paper">
            <div class="page-header">
                <span id="headerJuz">الجزء 1</span>
                <span id="headerPage">1</span>
                <span id="headerSurah">سورة الفاتحة</span>
            </div>
            <div id="pageLoader" class="loader hidden"></div>
            <div id="mushafText" class="quran-text"></div>
        </div>
    </div>

    <!-- شريط الصوت المثالي والمستقر -->
    <div id="audioBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-2xl p-3 z-40 hidden">
        <div class="max-w-2xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <button id="mainPlayBtn" onclick="toggleContinuousPlay()" class="w-12 h-12 rounded-full bg-[#0f4c3a] text-white flex items-center justify-center text-lg shadow-md hover:scale-105 transition flex-shrink-0">
                    <i id="playIcon" class="fas fa-play ml-1"></i>
                </button>
                <div>
                    <span id="audioStatusText" class="text-sm font-bold text-gray-800 block whitespace-nowrap">التلاوة متوقفة</span>
                    <span id="subStatusText" class="text-[11px] text-gray-500 font-semibold">انقر على آية للتفسير</span>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2 text-xs">
                <!-- قائمة القراء النخبة (بدون سديس أو عبد الباسط) وموثوقين 100% -->
                <select id="reciterSelect" onchange="updateReciter()" class="bg-gray-100 border border-gray-300 rounded-lg p-2 font-bold text-gray-800 outline-none w-[150px] shadow-sm">
                    <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
                    <option value="ar.alafasy">مشاري العفاسي</option>
                    <option value="ar.husary">محمود الحصري</option>
                    <option value="ar.minshawi">محمد المنشاوي</option>
                    <option value="ar.hudhaify">علي الحذيفي</option>
                    <option value="ar.abdullahbasfar">عبد الله بصفر</option>
                </select>

                <select id="repeatSelect" class="bg-gray-100 border border-gray-300 rounded-lg p-2 font-bold text-gray-800 outline-none hidden sm:block shadow-sm">
                    <option value="1">تكرار: 1</option>
                    <option value="2">تكرار: 2</option>
                    <option value="3">تكرار: 3</option>
                </select>
                
                <label class="flex items-center gap-1 cursor-pointer bg-emerald-50 text-emerald-800 px-3 py-2 rounded-lg border border-emerald-200 shadow-sm">
                    <input type="checkbox" id="pauseAfterAyah" class="rounded text-emerald-600 focus:ring-0">
                    <span class="text-[12px] font-bold">مهلة تلقين</span>
                </label>
            </div>
        </div>
    </div>

    <!-- نافذة التفسير -->
    <div id="drawerOverlay" onclick="closeDrawer()" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity backdrop-blur-sm"></div>
    <div id="tafsirDrawer" class="modal-drawer fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl p-6 z-50 max-w-xl mx-auto max-h-[80vh] flex flex-col border-t-4 border-[#0f4c3a]">
        <div class="flex justify-between items-center border-b border-gray-100 pb-4 mb-4">
            <div>
                <span id="drawerSurahAyah" class="text-base font-bold text-[#0f4c3a]">سورة الفاتحة</span>
                <span class="text-xs text-gray-500 block mt-1">التفسير الميسر (مجمع الملك فهد)</span>
            </div>
            <button onclick="closeDrawer()" class="bg-gray-100 text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-full w-8 h-8 flex items-center justify-center transition"><i class="fas fa-times"></i></button>
        </div>
        <div class="overflow-y-auto pr-2 flex-1 text-sm text-gray-700 leading-relaxed custom-scrollbar" id="drawerContent"></div>
    </div>

    <!-- المشغل الصوتي المبرمج بعناية تامة -->
    <audio id="audioPlayer"></audio>

    <script>
        // إعدادات أساسية لضمان عدم وجود أي تشويه في الصوت
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.playbackRate = 1.0; 
        audioPlayer.defaultPlaybackRate = 1.0;
        audioPlayer.preservesPitch = true; // يحافظ على طبيعة الصوت مهما حدث

        // دالة التنقل بين شاشات التطبيق بسلاسة
        function navTo(screenId) {
            document.querySelectorAll('body > div[id$="Screen"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'mushafScreen') { 
                document.getElementById('audioBar').classList.remove('hidden'); 
            } else { 
                document.getElementById('audioBar').classList.add('hidden'); 
                stopAudio(); 
            }
            window.scrollTo(0,0);
        }

        // ================= قسم الأذكار =================
        const adhkarData = {
            morning: [
                { text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...)", count: 1 },
                { text: "بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم: (قُلْ هُوَ ٱللَّهُ أَحَدٌ...)، (قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ...)، (قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ...)", count: 3 },
                { text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لا إِلَهَ إِلا اللَّهُ، وَحْدَهُ لا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.", count: 1 },
                { text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ.", count: 1 },
                { text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.", count: 100 }
            ],
            evening: [
                { text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...)", count: 1 },
                { text: "بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم: الإخلاص، الفلق، والناس", count: 3 },
                { text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لا إِلَهَ إِلا اللَّهُ، وَحْدَهُ لا شَرِيكَ لَهُ.", count: 1 },
                { text: "اللَّهُمَّ بِكَ أَمْسَيْنَا، وَبِكَ أَصْبَحْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ.", count: 1 },
                { text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.", count: 100 }
            ],
            sleep: [
                { text: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.", count: 1 },
                { text: "يجمع كفيه ثم ينفث فيهما فيقرأ: قل هو الله أحد، قل أعوذ برب الفلق، قل أعوذ برب الناس، ثم يمسح بهما ما استطاع من جسده.", count: 3 },
                { text: "آية الكرسي: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...).", count: 1 },
                { text: "سُبْحَانَ اللَّهِ (33)، الْحَمْدُ لِلَّهِ (33)، اللَّهُ أَكْبَرُ (34).", count: 1 }
            ]
        };

        function openAdhkarList(type) {
            navTo('adhkarListScreen');
            const titleMap = { morning: 'أذكار الصباح', evening: 'أذكار المساء', sleep: 'أذكار النوم' };
            document.getElementById('adhkarTitle').innerText = titleMap[type];
            const container = document.getElementById('adhkarContainer');
            container.innerHTML = '';
            adhkarData[type].forEach((dhikr, index) => {
                container.innerHTML += `
                    <div id="dhikr-${index}" class="dhikr-card bg-white border border-gray-200 p-6 rounded-2xl shadow-sm relative overflow-hidden" onclick="clickDhikr(${index})">
                        <p class="text-xl font-['Amiri'] leading-loose text-gray-800 text-justify">${dhikr.text}</p>
                        <div class="mt-5 flex justify-between items-center border-t border-gray-100 pt-4">
                            <span class="text-sm text-gray-500 font-bold">التكرار المطلوب: ${dhikr.count}</span>
                            <div class="bg-[#0f4c3a] text-white w-12 h-12 rounded-full flex items-center justify-center font-bold text-xl shadow-md transition-all" id="dhikr-btn-${index}">
                                <span id="dhikr-count-${index}">${dhikr.count}</span>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function clickDhikr(index) {
            const countSpan = document.getElementById(`dhikr-count-${index}`);
            const btn = document.getElementById(`dhikr-btn-${index}`);
            const card = document.getElementById(`dhikr-${index}`);
            let current = parseInt(countSpan.innerText);
            
            if (current > 1) { 
                countSpan.innerText = current - 1; 
                card.style.transform = "scale(0.98)"; 
                setTimeout(() => card.style.transform = "scale(1)", 150); 
            } 
            else if (current === 1) { 
                countSpan.innerHTML = '<i class="fas fa-check"></i>'; 
                btn.classList.replace('bg-[#0f4c3a]', 'bg-green-500');
                card.classList.add('completed'); 
            }
        }

        // ================= قسم القرآن الكريم والصوت =================
        let allSurahs = [], currentPage = 1, pageAyahs = [], currentAyahIndex = 0, isPlaying = false, currentRepeatCount = 0, activeModalAyah = null;

        // جلب قائمة السور
        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                allSurahs = (await res.json()).data;
                renderSurahs(allSurahs);
                loadBookmarkInfo();
            } catch (err) {
                console.error("خطأ في جلب السور", err);
            }
        }

        function renderSurahs(surahs) {
            const grid = document.getElementById('surahsGrid');
            grid.innerHTML = '';
            surahs.forEach(s => {
                grid.innerHTML += `
                    <div onclick="openSurah(${s.number})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:border-[#0f4c3a] hover:shadow-md cursor-pointer flex justify-between items-center transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-emerald-50 text-[#0f4c3a] border border-emerald-200 flex items-center justify-center font-bold text-sm">${s.number}</div>
                            <h3 class="font-bold font-['Amiri'] text-xl text-gray-800">${s.name}</h3>
                        </div>
                        <span class="text-xs font-bold bg-gray-100 text-gray-500 px-2 py-1 rounded-md">${s.numberOfAyahs} آية</span>
                    </div>`;
            });
            document.getElementById('listLoader').classList.add('hidden');
            grid.classList.remove('hidden');
        }

        function searchSurah() { 
            const term = document.getElementById('searchInput').value;
            renderSurahs(allSurahs.filter(s => s.name.includes(term))); 
        }

        async function openSurah(surahNumber) {
            navTo('mushafScreen');
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}`);
                loadPage((await res.json()).data.ayahs[0].page);
            } catch(e) {}
        }

        async function loadPage(pageNum) {
            if (pageNum < 1 || pageNum > 604) return;
            currentPage = pageNum;
            stopAudio(); // إيقاف أي تلاوة سابقة عند تغيير الصفحة
            document.getElementById('mushafText').innerHTML = '';
            document.getElementById('pageLoader').classList.remove('hidden');

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
                pageAyahs = (await res.json()).data.ayahs;
                currentAyahIndex = 0;

                document.getElementById('headerPage').innerText = pageNum;
                document.getElementById('headerJuz').innerText = `الجزء ${pageAyahs[0].juz}`;
                document.getElementById('headerSurah').innerText = pageAyahs[0].surah.name;

                let html = '';
                pageAyahs.forEach((ayah, idx) => {
                    let rawText = ayah.text;
                    let hasBismillah = false;
                    
                    // معالجة البسملة في بداية السور
                    if (ayah.numberInSurah === 1) {
                        html += `<div class="surah-frame">${ayah.surah.name}</div>`;
                        if (ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                            hasBismillah = true;
                            rawText = rawText.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*|^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '');
                        }
                    }
                    if (hasBismillah) html += `<div class="bismillah-box">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
                    
                    html += `<span id="ayah-node-${idx}" class="ayah-span" onclick="openAyahTafsir(${idx})">${rawText} <span class="ayah-number">﴿${toArabic(ayah.numberInSurah)}﴾</span></span> `;
                });
                
                document.getElementById('mushafText').innerHTML = html;
                document.getElementById('pageLoader').classList.add('hidden');
                
                // حفظ تلقائي لآخر صفحة كفاصل مرجعي
                localStorage.setItem('quran_last_page', pageNum);
                loadBookmarkInfo();
            } catch (err) {
                document.getElementById('pageLoader').classList.add('hidden');
                document.getElementById('mushafText').innerHTML = '<p class="text-center text-red-500 font-bold mt-10">حدث خطأ في تحميل الصفحة. تأكد من الإنترنت.</p>';
            }
        }

        // ================= التحكم بالصوت (النسخة الذهبية الخالية من القفز) =================
        function toggleContinuousPlay() {
            if (isPlaying) {
                stopAudio();
            } else { 
                isPlaying = true; 
                document.getElementById('playIcon').className = 'fas fa-pause ml-0'; 
                playAyahAtIndex(currentAyahIndex); 
            }
        }

        function playAyahAtIndex(index) {
            if (!isPlaying) return;
            
            // عند انتهاء الصفحة، الانتقال للتالية بعد ثانية ونصف
            if (index >= pageAyahs.length) {
                if (currentPage < 604) { 
                    changePage(-1); 
                    setTimeout(() => { if(isPlaying) playAyahAtIndex(0); }, 1500); 
                } else {
                    stopAudio();
                }
                return;
            }
            
            currentAyahIndex = index;
            
            // تظليل الآية المحددة والنزول إليها بسلاسة
            document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('ayah-playing'));
            const activeNode = document.getElementById(`ayah-node-${index}`);
            if (activeNode) { 
                activeNode.classList.add('ayah-playing'); 
                activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            }

            const reciter = document.getElementById('reciterSelect').value;
            const globalAyahNum = pageAyahs[index].number; 

            // إظهار حالة التحميل للمستخدم لكي لا يظن أن التطبيق معلق
            document.getElementById('audioStatusText').innerHTML = `يتلو: ${pageAyahs[index].surah.name} <span class="text-xs text-amber-600">(جاري التحميل...)</span>`;
            document.getElementById('subStatusText').innerText = 'يرجى الانتظار قليلاً...';
            
            // تأكيد السرعة الطبيعية 100% بدون أي تلاعب
            audioPlayer.playbackRate = 1.0; 
            
            // استخدام الخادم الرسمي الموثوق بجودة ممتازة
            audioPlayer.src = `https://cdn.islamic.network/quran/audio/128/${reciter}/${globalAyahNum}.mp3`;
            
            audioPlayer.play().catch(e => {
                console.log("الصوت في وضع الانتظار...");
            });
        }

        // عند بدء التشغيل الفعلي (تم التحميل)
        audioPlayer.onplaying = function() {
            if (!isPlaying) return;
            document.getElementById('audioStatusText').innerText = `يتلو: ${pageAyahs[currentAyahIndex].surah.name} (آية ${pageAyahs[currentAyahIndex].numberInSurah})`;
            document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير';
        };

        // هندسة دقيقة للانتقال بين الآيات بهدوء وخشوع
        audioPlayer.onended = function() {
            if (!isPlaying) return;
            const maxRepeat = parseInt(document.getElementById('repeatSelect').value) || 1;
            currentRepeatCount++;
            
            const nextAction = () => {
                if (!isPlaying) return;
                if (currentRepeatCount < maxRepeat) {
                    // فاصل نصف ثانية قبل إعادة نفس الآية
                    setTimeout(() => { if(isPlaying) audioPlayer.play(); }, 500); 
                } else {
                    currentRepeatCount = 0; 
                    // فاصل ثانية كاملة لراحة الأذن قبل الآية الجديدة
                    setTimeout(() => { if(isPlaying) playAyahAtIndex(currentAyahIndex + 1); }, 1000); 
                }
            };

            const isPauseEnabled = document.getElementById('pauseAfterAyah').checked;
            if (isPauseEnabled) {
                // مهلة تلقين الطالب (تساوي مدة الآية نفسها)
                document.getElementById('subStatusText').innerHTML = '<span class="text-emerald-600 font-bold">مهلة للترديد... اقرأ الآن</span>';
                setTimeout(() => { 
                    document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير'; 
                    nextAction(); 
                }, (audioPlayer.duration || 3) * 1000);
            } else {
                nextAction();
            }
        };

        // إيقاف المشغل كلياً عند الخطأ بدلاً من القفز العشوائي
        audioPlayer.onerror = function() {
            if (isPlaying) {
                stopAudio();
                document.getElementById('audioStatusText').innerHTML = '<span class="text-red-600 font-bold">توقف بسبب الإنترنت!</span>';
                document.getElementById('subStatusText').innerText = 'تأكد من الاتصال واضغط تشغيل مجدداً';
            }
        };

        function stopAudio() {
            audioPlayer.pause(); 
            isPlaying = false; 
            currentRepeatCount = 0;
            document.getElementById('playIcon').className = 'fas fa-play ml-1';
            document.getElementById('audioStatusText').innerText = 'التلاوة متوقفة';
            document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير';
            document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('ayah-playing'));
        }

        function updateReciter() { 
            if (isPlaying) {
                stopAudio();
                setTimeout(() => toggleContinuousPlay(), 300);
            }
        }

        // ================= التفسير الميسر =================
        async function openAyahTafsir(index) {
            activeModalAyah = pageAyahs[index];
            document.getElementById('drawerSurahAyah').innerText = `${activeModalAyah.surah.name} - الآية ${activeModalAyah.numberInSurah}`;
            document.getElementById('drawerContent').innerHTML = '<div class="loader"></div>';
            document.getElementById('drawerOverlay').classList.remove('hidden');
            document.getElementById('tafsirDrawer').classList.add('active');
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${activeModalAyah.number}/ar.muyassar`);
                const data = await res.json();
                document.getElementById('drawerContent').innerHTML = `
                    <div class="bg-amber-50/50 p-4 rounded-2xl mb-4 border border-amber-100">
                        <p class="font-['Amiri_Quran'] text-2xl text-[#0f4c3a] leading-loose text-center">${activeModalAyah.text}</p>
                    </div>
                    <div class="flex gap-2">
                        <i class="fas fa-book-open text-amber-600 mt-1"></i>
                        <p class="text-gray-800 leading-relaxed font-semibold text-justify">${data.data.text}</p>
                    </div>`;
            } catch (err) { 
                document.getElementById('drawerContent').innerHTML = '<p class="text-center text-red-500 font-bold">عذراً، تعذر تحميل التفسير حالياً لضعف الاتصال.</p>'; 
            }
        }

        function closeDrawer() { 
            document.getElementById('drawerOverlay').classList.add('hidden'); 
            document.getElementById('tafsirDrawer').classList.remove('active'); 
        }

        // ================= العلامات المرجعية والتقليب =================
        function saveCurrentBookmark() { 
            localStorage.setItem('quran_bookmark_page', currentPage); 
            alert(`تم حفظ الفاصل المرجعي عند الصفحة (${currentPage}) بنجاح.`); 
            loadBookmarkInfo(); 
        }
        
        function resumeBookmark() { 
            navTo('mushafScreen'); 
            const savedPage = parseInt(localStorage.getItem('quran_bookmark_page')) || parseInt(localStorage.getItem('quran_last_page')) || 1;
            loadPage(savedPage); 
        }
        
        function loadBookmarkInfo() { 
            const page = parseInt(localStorage.getItem('quran_bookmark_page')) || parseInt(localStorage.getItem('quran_last_page')) || 1;
            document.getElementById('khatmahLabel').innerText = `الصفحة ${page}`; 
        }
        
        function changePage(direction) { 
            let newPage = direction === -1 ? currentPage + 1 : currentPage - 1;
            loadPage(newPage); 
        }
        
        function toArabic(num) { 
            return num.toString().split('').map(c => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][c] || c).join(''); 
        }

        // تهيئة التطبيق عند الفتح
        fetchSurahs();
    </script>
</body>
</html>
