<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- أوامر إجبارية لمنع المتصفح من الاحتفاظ بالنسخ القديمة -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>تطبيق القارئ - قرآن وأذكار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #f7f7f2;
            --text-main: #1a1a1a;
            --bg-mushaf: #fffef6;
            --border-mushaf: #e2dfd2;
            --frame-bg: repeating-linear-gradient(45deg, #eee8d5, #eee8d5 10px, #fbf7ea 10px, #fbf7ea 20px);
            --hover-ayah: #fef9c3;
        }

        /* الوضع الليلي (Dark Mode) */
        body.dark-mode {
            --bg-body: #121212;
            --text-main: #e0e0e0;
            --bg-mushaf: #1e1e1e;
            --border-mushaf: #333;
            --frame-bg: repeating-linear-gradient(45deg, #2d3748, #2d3748 10px, #1a202c 10px, #1a202c 20px);
            --hover-ayah: #374151;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-body); color: var(--text-main); user-select: none; transition: background-color 0.3s; }
        
        /* إخفاء إعلانات الاستضافة إن وجدت */
        netlify-badge, #netlify-badge, .netlify-badge, a[href*="netlify.com"] { display: none !important; opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

        .mushaf-paper { 
            background-color: var(--bg-mushaf); border: 1px solid var(--border-mushaf); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 750px; margin: 0 auto; 
            padding: 24px 20px; min-height: 75vh; position: relative; transition: all 0.3s;
        }
        
        .page-header { display: flex; justify-content: space-between; align-items: center; font-family: 'Amiri', serif; font-size: 17px; font-weight: bold; border-bottom: 2px solid #0f4c3a; padding-bottom: 6px; margin-bottom: 18px; color: var(--text-main); }
        
        .quran-text { 
            font-family: 'Amiri Quran', serif; font-size: 26px; /* الحجم الافتراضي */
            line-height: 2.4; text-align: justify; text-justify: inter-word; transition: font-size 0.3s;
        }
        
        .surah-frame { text-align: center; font-family: 'Amiri', serif; font-size: 24px; font-weight: bold; background: var(--frame-bg); border: 2px solid #4a5568; padding: 10px; margin: 16px 0; border-radius: 6px; color: var(--text-main); }
        
        .bismillah-box { text-align: center; font-size: 28px; margin-bottom: 12px; font-family: 'Amiri Quran', serif; display: block; color: #0f4c3a; }
        
        .ayah-span { cursor: pointer; border-radius: 5px; padding: 2px 3px; transition: all 0.2s ease; }
        .ayah-span:hover { background-color: var(--hover-ayah); }
        .ayah-playing { background-color: #bbf7d0 !important; color: #064e3b !important; font-weight: bold; border-bottom: 2px solid #059669; }
        body.dark-mode .ayah-playing { background-color: #065f46 !important; color: #d1fae5 !important; border-bottom-color: #34d399; }
        
        .ayah-number { color: #8b0000; font-size: 0.8em; margin: 0 4px; display: inline-block; }
        body.dark-mode .ayah-number { color: #f87171; }

        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0f4c3a; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-drawer { transition: transform 0.3s ease-out; transform: translateY(100%); }
        .modal-drawer.active { transform: translateY(0); }
        
        .dhikr-card { transition: all 0.2s ease; cursor: pointer; background-color: var(--bg-mushaf); border-color: var(--border-mushaf); }
        .dhikr-card.completed { background-color: #d1fae5; border-color: #10b981; opacity: 0.8; }
        body.dark-mode .dhikr-card.completed { background-color: #064e3b; border-color: #059669; }
    </style>
</head>
<body class="pb-36 transition-colors duration-300">

    <!-- الشاشة الرئيسية -->
    <div id="homeScreen" class="container mx-auto px-4 py-12 max-w-lg min-h-screen flex flex-col justify-center">
        <div class="text-center mb-10">
            <i class="fas fa-mosque text-7xl text-[#0f4c3a] mb-4 drop-shadow-md"></i>
            <h1 class="text-5xl font-bold font-['Amiri'] text-[#0f4c3a] mb-2">زاد المسلم</h1>
            <p class="text-sm font-semibold opacity-80">القرآن الكريم والأذكار اليومية</p>
        </div>
        <div class="grid grid-cols-1 gap-5">
            <button onclick="navTo('indexScreen')" class="bg-[#0f4c3a] hover:bg-[#0b382a] text-white p-6 rounded-2xl shadow-xl flex items-center justify-between transition group">
                <div class="flex items-center gap-4">
                    <div class="bg-white/20 p-4 rounded-full"><i class="fas fa-book-open text-3xl"></i></div>
                    <div class="text-right"><h2 class="text-3xl font-bold font-['Amiri'] mb-1">القرآن الكريم</h2><p class="text-sm text-gray-200">تلاوة، تحفيظ، وتفسير</p></div>
                </div>
                <i class="fas fa-chevron-left text-2xl group-hover:-translate-x-2 transition"></i>
            </button>
            <button onclick="navTo('adhkarCategoryScreen')" class="bg-white border-2 border-[#0f4c3a] text-[#0f4c3a] hover:bg-gray-50 p-6 rounded-2xl shadow-xl flex items-center justify-between transition group dark:bg-gray-800 dark:border-gray-600 dark:text-gray-100">
                <div class="flex items-center gap-4">
                    <div class="bg-[#0f4c3a]/10 p-4 rounded-full dark:bg-gray-700"><i class="fas fa-hands-praying text-3xl"></i></div>
                    <div class="text-right"><h2 class="text-3xl font-bold font-['Amiri'] mb-1">الأذكار</h2><p class="text-sm opacity-80">صباح، مساء، ونوم</p></div>
                </div>
                <i class="fas fa-chevron-left text-2xl group-hover:-translate-x-2 transition"></i>
            </button>
        </div>
    </div>

    <!-- أقسام الأذكار -->
    <div id="adhkarCategoryScreen" class="hidden container mx-auto px-4 py-8 max-w-lg">
        <button onclick="navTo('homeScreen')" class="mb-6 opacity-80 hover:opacity-100 font-bold flex items-center gap-2"><i class="fas fa-arrow-right"></i> الرئيسية</button>
        <h2 class="text-4xl font-bold font-['Amiri'] text-center text-[#0f4c3a] mb-8 dark:text-emerald-400">حصن المسلم</h2>
        <div class="grid grid-cols-1 gap-4">
            <button onclick="openAdhkarList('morning')" class="bg-blue-50 border border-blue-200 p-5 rounded-xl shadow flex items-center justify-between text-blue-900 hover:bg-blue-100 dark:bg-blue-900 dark:text-blue-100 dark:border-blue-800"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-sun text-yellow-500 ml-2"></i> أذكار الصباح</span><i class="fas fa-chevron-left"></i></button>
            <button onclick="openAdhkarList('evening')" class="bg-orange-50 border border-orange-200 p-5 rounded-xl shadow flex items-center justify-between text-orange-900 hover:bg-orange-100 dark:bg-orange-900 dark:text-orange-100 dark:border-orange-800"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-moon text-indigo-500 ml-2"></i> أذكار المساء</span><i class="fas fa-chevron-left"></i></button>
            <button onclick="openAdhkarList('sleep')" class="bg-indigo-50 border border-indigo-200 p-5 rounded-xl shadow flex items-center justify-between text-indigo-900 hover:bg-indigo-100 dark:bg-indigo-900 dark:text-indigo-100 dark:border-indigo-800"><span class="text-xl font-bold font-['Amiri']"><i class="fas fa-bed text-purple-500 ml-2"></i> أذكار النوم</span><i class="fas fa-chevron-left"></i></button>
        </div>
    </div>

    <!-- قراءة الأذكار -->
    <div id="adhkarListScreen" class="hidden container mx-auto px-4 py-8 max-w-xl pb-24">
        <button onclick="navTo('adhkarCategoryScreen')" class="mb-4 opacity-80 hover:opacity-100 font-bold flex items-center gap-2"><i class="fas fa-arrow-right"></i> رجوع للأقسام</button>
        <h2 id="adhkarTitle" class="text-3xl font-bold font-['Amiri'] text-center text-[#0f4c3a] mb-2 dark:text-emerald-400">الأذكار</h2>
        <p class="text-center text-xs opacity-60 mb-6 border-b border-gray-300 pb-4">انقر على الذكر عند قراءته ليتم حسابه</p>
        <div id="adhkarContainer" class="flex flex-col gap-4"></div>
    </div>

    <!-- فهرس القرآن -->
    <div id="indexScreen" class="hidden container mx-auto px-4 py-8 max-w-3xl">
        <button onclick="navTo('homeScreen')" class="mb-4 text-white hover:text-gray-200 font-bold bg-[#0f4c3a] px-4 py-2 rounded-lg shadow inline-flex items-center gap-2"><i class="fas fa-home"></i> الرئيسية</button>
        <div class="text-center mb-6 bg-[#0f4c3a] text-white p-6 rounded-2xl shadow-lg relative overflow-hidden">
            <h1 class="text-4xl font-bold font-['Amiri'] mb-1">القرآن الكريم</h1>
            <p class="text-sm text-gray-200 mb-5">استمع، اقرأ، وتدبر كلام الله</p>
            <div class="bg-white/10 p-4 rounded-xl border border-white/20 flex justify-between items-center gap-3">
                <div class="text-right">
                    <span class="text-xs text-yellow-300 font-bold block">متابعة الختمة</span>
                    <span id="khatmahLabel" class="text-sm font-semibold">الصفحة 1</span>
                </div>
                <button onclick="resumeBookmark()" class="bg-[#d4af37] text-gray-900 px-5 py-2 rounded-lg font-bold shadow-md hover:bg-yellow-500 transition">واصل القراءة</button>
            </div>
        </div>
        <input type="text" id="searchInput" onkeyup="searchSurah()" placeholder="ابحث باسم السورة..." class="w-full px-5 py-3 rounded-xl border-2 border-gray-300 focus:border-[#0f4c3a] outline-none mb-6 text-base shadow-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white">
        <div id="listLoader" class="loader"></div>
        <div id="surahsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 hidden"></div>
    </div>

    <!-- المصحف (القراءة) -->
    <div id="mushafScreen" class="hidden pt-3 px-2">
        <!-- شريط أدوات القراءة العلوي (جديد) -->
        <div class="max-w-[750px] mx-auto flex justify-between items-center mb-3 bg-white/50 p-2 rounded-xl shadow-sm dark:bg-gray-800/50">
            <div class="flex gap-2">
                <button onclick="navTo('indexScreen'); stopAudio();" class="bg-gray-800 text-white px-3 py-2 rounded-lg text-xs font-bold shadow hover:bg-gray-900 transition"><i class="fas fa-list ml-1"></i> الفهرس</button>
                <button onclick="saveCurrentBookmark()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg text-xs font-bold shadow transition"><i class="fas fa-bookmark"></i> حفظ</button>
            </div>
            
            <!-- أدوات التحكم بالشاشة (الخط والوضع الليلي) -->
            <div class="flex items-center gap-2 border-r border-gray-300 pr-2">
                <button onclick="toggleDarkMode()" class="bg-indigo-600 text-white w-8 h-8 rounded-full shadow flex items-center justify-center transition" title="الوضع الليلي">
                    <i id="themeIcon" class="fas fa-moon"></i>
                </button>
                <div class="flex bg-gray-200 rounded-lg overflow-hidden shadow-inner dark:bg-gray-700">
                    <button onclick="changeFontSize(2)" class="px-3 py-1 hover:bg-gray-300 text-gray-800 font-bold dark:text-white dark:hover:bg-gray-600 text-lg" title="تكبير الخط">A+</button>
                    <button onclick="changeFontSize(-2)" class="px-3 py-1 hover:bg-gray-300 text-gray-800 font-bold dark:text-white dark:hover:bg-gray-600 text-sm border-r border-gray-300 dark:border-gray-500" title="تصغير الخط">A-</button>
                </div>
            </div>
        </div>

        <!-- أزرار التقليب العلوية -->
        <div class="max-w-[750px] mx-auto flex justify-between items-center mb-3">
            <button onclick="changePage(1)" class="bg-[#0f4c3a] text-white px-6 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-[#0c3b2d] w-1/2 ml-1">الصفحة السابقة</button>
            <button onclick="changePage(-1)" class="bg-[#0f4c3a] text-white px-6 py-2 rounded-lg text-sm font-bold shadow-md hover:bg-[#0c3b2d] w-1/2 mr-1">الصفحة التالية</button>
        </div>

        <div class="mushaf-paper" id="mushafContainer">
            <div class="page-header">
                <span id="headerJuz">الجزء 1</span>
                <span id="headerPage">1</span>
                <span id="headerSurah">سورة الفاتحة</span>
            </div>
            <div id="pageLoader" class="loader hidden"></div>
            <div id="mushafText" class="quran-text"></div>
        </div>
    </div>

    <!-- شريط الصوت (تم إزالة السديس وعبد الباسط، وضمان الصوت الطبيعي 100%) -->
    <div id="audioBar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-2xl p-3 z-40 hidden dark:bg-gray-900/95 dark:border-gray-700">
        <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <button id="mainPlayBtn" onclick="toggleContinuousPlay()" class="w-12 h-12 rounded-full bg-[#0f4c3a] text-white flex items-center justify-center text-xl shadow-md hover:scale-105 transition flex-shrink-0">
                    <i id="playIcon" class="fas fa-play ml-1"></i>
                </button>
                <div>
                    <span id="audioStatusText" class="text-sm font-bold block whitespace-nowrap">التلاوة متوقفة</span>
                    <span id="subStatusText" class="text-xs text-gray-500 font-semibold dark:text-gray-400">انقر على آية للتفسير</span>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2 text-xs">
                <!-- قائمة القراء النهائية والخالية من الأخطاء -->
                <select id="reciterSelect" onchange="updateReciter()" class="bg-gray-100 border border-gray-300 rounded-lg p-2 font-bold text-gray-800 outline-none w-[160px] shadow-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white">
                    <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
                    <option value="ar.alafasy">مشاري العفاسي</option>
                    <option value="ar.husary">محمود الحصري</option>
                    <option value="ar.minshawi">محمد المنشاوي</option>
                    <option value="ar.hudhaify">علي الحذيفي</option>
                    <option value="ar.abdullahbasfar">عبد الله بصفر</option>
                </select>

                <select id="repeatSelect" class="bg-gray-100 border border-gray-300 rounded-lg p-2 font-bold text-gray-800 outline-none hidden sm:block shadow-sm dark:bg-gray-800 dark:border-gray-600 dark:text-white">
                    <option value="1">بدون تكرار</option>
                    <option value="2">تكرار مرتين</option>
                    <option value="3">تكرار 3 مرات</option>
                </select>
                
                <label class="flex items-center gap-1 cursor-pointer bg-emerald-50 text-emerald-800 px-3 py-2 rounded-lg border border-emerald-200 shadow-sm dark:bg-emerald-900/30 dark:border-emerald-800 dark:text-emerald-300">
                    <input type="checkbox" id="pauseAfterAyah" class="rounded text-emerald-600 focus:ring-0">
                    <span class="text-[12px] font-bold">مهلة ترديد</span>
                </label>
            </div>
        </div>
    </div>

    <!-- نافذة التفسير -->
    <div id="drawerOverlay" onclick="closeDrawer()" class="fixed inset-0 bg-black/60 z-50 hidden transition-opacity backdrop-blur-sm"></div>
    <div id="tafsirDrawer" class="modal-drawer fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 rounded-t-3xl shadow-2xl p-6 z-50 max-w-2xl mx-auto max-h-[85vh] flex flex-col border-t-4 border-[#0f4c3a]">
        <div class="flex justify-between items-center border-b border-gray-200 dark:border-gray-700 pb-4 mb-4">
            <div>
                <span id="drawerSurahAyah" class="text-lg font-bold text-[#0f4c3a] dark:text-emerald-400">سورة الفاتحة</span>
                <span class="text-sm text-gray-500 block mt-1 dark:text-gray-400">التفسير الميسر</span>
            </div>
            <button onclick="closeDrawer()" class="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-300 hover:text-red-500 rounded-full w-10 h-10 flex items-center justify-center transition text-lg"><i class="fas fa-times"></i></button>
        </div>
        <div class="overflow-y-auto pr-2 flex-1 text-base text-gray-800 dark:text-gray-200 leading-relaxed custom-scrollbar" id="drawerContent"></div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // إعدادات الصوت الطبيعية 100% (تم إزالة أي كود يؤثر على السرعة)
        const audioPlayer = document.getElementById('audioPlayer');
        audioPlayer.playbackRate = 1.0; 
        audioPlayer.defaultPlaybackRate = 1.0;

        // إعدادات الخط والوضع الليلي (الميزات الجديدة)
        let currentFontSize = parseInt(localStorage.getItem('quran_font_size')) || 26;
        document.getElementById('mushafText').style.fontSize = currentFontSize + 'px';

        function changeFontSize(step) {
            currentFontSize += step;
            if(currentFontSize < 18) currentFontSize = 18; // حد أدنى
            if(currentFontSize > 50) currentFontSize = 50; // حد أقصى
            document.getElementById('mushafText').style.fontSize = currentFontSize + 'px';
            localStorage.setItem('quran_font_size', currentFontSize);
        }

        // تفعيل الوضع الليلي المحفوظ
        if (localStorage.getItem('quran_dark_mode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('quran_dark_mode', isDark);
            
            const icon = document.getElementById('themeIcon');
            if(isDark) icon.classList.replace('fa-moon', 'fa-sun');
            else icon.classList.replace('fa-sun', 'fa-moon');
        }

        function navTo(screenId) {
            document.querySelectorAll('body > div[id$="Screen"]').forEach(el => el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if(screenId === 'mushafScreen') { 
                document.getElementById('audioBar').classList.remove('hidden'); 
            } else { 
                document.getElementById('audioBar').classList.add('hidden'); 
                stopAudio(); 
            }
            window.scrollTo(0,0);
        }

        // ================= الأذكار =================
        const adhkarData = {
            morning: [
                { text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...)", count: 1 },
                { text: "بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم: (قُلْ هُوَ ٱللَّهُ أَحَدٌ...)، (قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ...)، (قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ...)", count: 3 },
                { text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لا إِلَهَ إِلا اللَّهُ...", count: 1 },
                { text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.", count: 100 }
            ],
            evening: [
                { text: "أَعُوذُ بِاللهِ مِنْ الشَّيْطَانِ الرَّجِيمِ: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...)", count: 1 },
                { text: "بِسْمِ اللهِ الرَّحْمنِ الرَّحِيم: الإخلاص، الفلق، والناس", count: 3 },
                { text: "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ لا إِلَهَ إِلا اللَّهُ...", count: 1 },
                { text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ.", count: 100 }
            ],
            sleep: [
                { text: "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا.", count: 1 },
                { text: "آية الكرسي: (اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...).", count: 1 },
                { text: "سُبْحَانَ اللَّهِ (33)، الْحَمْدُ لِلَّهِ (33)، اللَّهُ أَكْبَرُ (34).", count: 1 }
            ]
        };

        function openAdhkarList(type) {
            navTo('adhkarListScreen');
            const titleMap = { morning: 'أذكار الصباح', evening: 'أذكار المساء', sleep: 'أذكار النوم' };
            document.getElementById('adhkarTitle').innerText = titleMap[type];
            const container = document.getElementById('adhkarContainer');
            container.innerHTML = '';
            adhkarData[type].forEach((dhikr, index) => {
                container.innerHTML += `
                    <div id="dhikr-${index}" class="dhikr-card p-6 rounded-2xl shadow-sm relative overflow-hidden dark:bg-gray-800" onclick="clickDhikr(${index})">
                        <p class="text-2xl font-['Amiri'] leading-loose text-justify">${dhikr.text}</p>
                        <div class="mt-5 flex justify-between items-center border-t border-gray-200 dark:border-gray-700 pt-4">
                            <span class="text-sm opacity-70 font-bold">التكرار المطلوب: ${dhikr.count}</span>
                            <div class="bg-[#0f4c3a] text-white w-14 h-14 rounded-full flex items-center justify-center font-bold text-2xl shadow-md transition-all" id="dhikr-btn-${index}">
                                <span id="dhikr-count-${index}">${dhikr.count}</span>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function clickDhikr(index) {
            const countSpan = document.getElementById(`dhikr-count-${index}`);
            const btn = document.getElementById(`dhikr-btn-${index}`);
            const card = document.getElementById(`dhikr-${index}`);
            let current = parseInt(countSpan.innerText);
            
            if (current > 1) { 
                countSpan.innerText = current - 1; 
                card.style.transform = "scale(0.98)"; 
                setTimeout(() => card.style.transform = "scale(1)", 150); 
            } 
            else if (current === 1) { 
                countSpan.innerHTML = '<i class="fas fa-check"></i>'; 
                btn.classList.replace('bg-[#0f4c3a]', 'bg-green-500');
                card.classList.add('completed'); 
            }
        }

        // ================= القرآن والصوت =================
        let allSurahs = [], currentPage = 1, pageAyahs = [], currentAyahIndex = 0, isPlaying = false, currentRepeatCount = 0, activeModalAyah = null;

        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                allSurahs = (await res.json()).data;
                renderSurahs(allSurahs);
                loadBookmarkInfo();
            } catch (err) {}
        }

        function renderSurahs(surahs) {
            const grid = document.getElementById('surahsGrid');
            grid.innerHTML = '';
            surahs.forEach(s => {
                grid.innerHTML += `
                    <div onclick="openSurah(${s.number})" class="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 hover:border-[#0f4c3a] cursor-pointer flex justify-between items-center transition">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-emerald-50 dark:bg-emerald-900/40 text-[#0f4c3a] dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800 flex items-center justify-center font-bold text-sm">${s.number}</div>
                            <h3 class="font-bold font-['Amiri'] text-xl">${s.name}</h3>
                        </div>
                        <span class="text-xs font-bold bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-md opacity-80">${s.numberOfAyahs} آية</span>
                    </div>`;
            });
            document.getElementById('listLoader').classList.add('hidden');
            grid.classList.remove('hidden');
        }

        function searchSurah() { renderSurahs(allSurahs.filter(s => s.name.includes(document.getElementById('searchInput').value))); }

        async function openSurah(surahNumber) {
            navTo('mushafScreen');
            const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}`);
            loadPage((await res.json()).data.ayahs[0].page);
        }

        async function loadPage(pageNum) {
            if (pageNum < 1 || pageNum > 604) return;
            currentPage = pageNum;
            stopAudio();
            document.getElementById('mushafText').innerHTML = '';
            document.getElementById('pageLoader').classList.remove('hidden');

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-uthmani`);
                pageAyahs = (await res.json()).data.ayahs;
                currentAyahIndex = 0;

                document.getElementById('headerPage').innerText = pageNum;
                document.getElementById('headerJuz').innerText = `الجزء ${pageAyahs[0].juz}`;
                document.getElementById('headerSurah').innerText = pageAyahs[0].surah.name;

                let html = '';
                pageAyahs.forEach((ayah, idx) => {
                    let rawText = ayah.text;
                    let hasBismillah = false;
                    if (ayah.numberInSurah === 1) {
                        html += `<div class="surah-frame">${ayah.surah.name}</div>`;
                        if (ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                            hasBismillah = true;
                            rawText = rawText.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*|^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '');
                        }
                    }
                    if (hasBismillah) html += `<div class="bismillah-box">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
                    html += `<span id="ayah-node-${idx}" class="ayah-span" onclick="openAyahTafsir(${idx})">${rawText} <span class="ayah-number">﴿${toArabic(ayah.numberInSurah)}﴾</span></span> `;
                });
                
                document.getElementById('mushafText').innerHTML = html;
                document.getElementById('pageLoader').classList.add('hidden');
                
                localStorage.setItem('quran_last_page', pageNum);
                loadBookmarkInfo();
            } catch (err) {}
        }

        // التشغيل مع الحفاظ على السرعة الطبيعية والانتقال المريح
        function toggleContinuousPlay() {
            if (isPlaying) { stopAudio(); } 
            else { isPlaying = true; document.getElementById('playIcon').className = 'fas fa-pause ml-0'; playAyahAtIndex(currentAyahIndex); }
        }

        function playAyahAtIndex(index) {
            if (!isPlaying) return;
            if (index >= pageAyahs.length) {
                if (currentPage < 604) { changePage(-1); setTimeout(() => { if(isPlaying) playAyahAtIndex(0); }, 1500); }
                else stopAudio();
                return;
            }
            currentAyahIndex = index;
            document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('ayah-playing'));
            const activeNode = document.getElementById(`ayah-node-${index}`);
            if (activeNode) { activeNode.classList.add('ayah-playing'); activeNode.scrollIntoView({ behavior: 'smooth', block: 'center' }); }

            const reciter = document.getElementById('reciterSelect').value;
            const globalAyahNum = pageAyahs[index].number; 

            document.getElementById('audioStatusText').innerHTML = `يتلو: ${pageAyahs[index].surah.name} <span class="text-xs text-amber-500">(تحميل...)</span>`;
            document.getElementById('subStatusText').innerText = 'لحظات...';
            
            // الصوت سيعمل بطبيعته الافتراضية (لا تسريع ولا إبطاء)
            audioPlayer.playbackRate = 1.0; 
            audioPlayer.src = `https://cdn.islamic.network/quran/audio/128/${reciter}/${globalAyahNum}.mp3`;
            audioPlayer.play().catch(e => console.log("جاري الانتظار"));
        }

        audioPlayer.onplaying = function() {
            if (!isPlaying) return;
            document.getElementById('audioStatusText').innerText = `يتلو: ${pageAyahs[currentAyahIndex].surah.name} (آية ${pageAyahs[currentAyahIndex].numberInSurah})`;
            document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير';
        };

        // هندسة الفاصل الزمني المريح (بدون تخطي سريع)
        audioPlayer.onended = function() {
            if (!isPlaying) return;
            const maxRepeat = parseInt(document.getElementById('repeatSelect').value) || 1;
            currentRepeatCount++;
            
            const nextAction = () => {
                if (!isPlaying) return;
                if (currentRepeatCount < maxRepeat) {
                    setTimeout(() => { if(isPlaying) audioPlayer.play(); }, 500); 
                } else {
                    currentRepeatCount = 0; 
                    // فاصل زمني (600 جزء من الثانية) يحاكي أخذ القارئ للنفس
                    setTimeout(() => { if(isPlaying) playAyahAtIndex(currentAyahIndex + 1); }, 600); 
                }
            };

            const isPauseEnabled = document.getElementById('pauseAfterAyah').checked;
            if (isPauseEnabled) {
                document.getElementById('subStatusText').innerHTML = '<span class="text-emerald-500 font-bold">اقرأ للترديد...</span>';
                setTimeout(() => { document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير'; nextAction(); }, (audioPlayer.duration || 3) * 1000);
            } else {
                nextAction();
            }
        };

        audioPlayer.onerror = function() {
            if (isPlaying) {
                stopAudio();
                document.getElementById('audioStatusText').innerHTML = '<span class="text-red-500 font-bold">توقف للإنترنت!</span>';
                document.getElementById('subStatusText').innerText = 'اضغط تشغيل للرقم المحاولة';
            }
        };

        function stopAudio() {
            audioPlayer.pause(); isPlaying = false; currentRepeatCount = 0;
            document.getElementById('playIcon').className = 'fas fa-play ml-1';
            document.getElementById('audioStatusText').innerText = 'التلاوة متوقفة';
            document.getElementById('subStatusText').innerText = 'انقر على آية للتفسير';
            document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('ayah-playing'));
        }

        function updateReciter() { 
            if (isPlaying) { stopAudio(); setTimeout(() => toggleContinuousPlay(), 300); }
        }

        // ================= التفسير =================
        async function openAyahTafsir(index) {
            activeModalAyah = pageAyahs[index];
            document.getElementById('drawerSurahAyah').innerText = `${activeModalAyah.surah.name} - الآية ${activeModalAyah.numberInSurah}`;
            document.getElementById('drawerContent').innerHTML = '<div class="loader"></div>';
            document.getElementById('drawerOverlay').classList.remove('hidden');
            document.getElementById('tafsirDrawer').classList.add('active');
            try {
                const res = await fetch(`https://api.alquran.cloud/v1/ayah/${activeModalAyah.number}/ar.muyassar`);
                const data = await res.json();
                document.getElementById('drawerContent').innerHTML = `
                    <div class="bg-amber-50/70 dark:bg-gray-800 p-5 rounded-2xl mb-5 border border-amber-100 dark:border-gray-700">
                        <p class="font-['Amiri_Quran'] text-3xl text-[#0f4c3a] dark:text-emerald-400 leading-loose text-center">${activeModalAyah.text}</p>
                    </div>
                    <div class="flex gap-3">
                        <i class="fas fa-book-open text-amber-600 dark:text-amber-500 mt-1 text-xl"></i>
                        <p class="text-gray-800 dark:text-gray-300 leading-loose font-semibold text-justify text-lg">${data.data.text}</p>
                    </div>`;
            } catch (err) { 
                document.getElementById('drawerContent').innerHTML = '<p class="text-center text-red-500 font-bold">خطأ في الاتصال، تعذر جلب التفسير.</p>'; 
            }
        }

        function closeDrawer() { document.getElementById('drawerOverlay').classList.add('hidden'); document.getElementById('tafsirDrawer').classList.remove('active'); }
        function saveCurrentBookmark() { localStorage.setItem('quran_bookmark_page', currentPage); alert(`تم حفظ العلامة عند الصفحة (${currentPage})`); loadBookmarkInfo(); }
        function resumeBookmark() { navTo('mushafScreen'); loadPage(parseInt(localStorage.getItem('quran_bookmark_page')) || parseInt(localStorage.getItem('quran_last_page')) || 1); }
        function loadBookmarkInfo() { document.getElementById('khatmahLabel').innerText = `الصفحة ${parseInt(localStorage.getItem('quran_bookmark_page')) || parseInt(localStorage.getItem('quran_last_page')) || 1}`; }
        function changePage(direction) { loadPage(direction === -1 ? currentPage + 1 : currentPage - 1); }
        function toArabic(num) { return num.toString().split('').map(c => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][c] || c).join(''); }

        fetchSurahs();
    </script>
</body>
</html>
